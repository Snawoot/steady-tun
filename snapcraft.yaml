name: steady-tun
summary: Secure TLS tunnel with pool of prepared upstream connections
description: >
  Secure TLS tunnel with pool of prepared upstream connections

confinement: strict
base: core22
adopt-info: steady-tun

parts:
  steady-tun:
    plugin: go
    build-snaps: [go/latest/stable]
    build-packages:
      - make
      - git-core
    source: https://github.com/Snawoot/steady-tun
    source-type: git
    override-pull: |
      craftctl default
      craftctl set version="$(git describe --tags --always --match=v*.*.* | sed 's/v//')"
    override-build:
      make &&
      cp bin/steady-tun "$SNAPCRAFT_PART_INSTALL"
    stage:
      - steady-tun

apps:
  steady-tun:
    command: steady-tun
    plugs:
      - network
      - network-bind
